<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="desktopBg.jpg">
    <title>Quick Notes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <!-- <h1>Quick Notes 📒</h1> -->
       <div class="intro">
         <img src="desktopBg.jpg" alt="">
        <h1>Quick Notes <span><a href="../../../htmlcssjs/html/nabnab.html" onclick="window.open('./../../htmlcssjs/html/nabnab.html', 'popup', 'width=600,height=400'); return false;">🔑</a></span></h1>
        <a href="type.html" onclick="window.open('type.html', 'popup', 'width=600,height=400'); return false;">⌨️</a>
       </div>
      <div>
        <button class="add-note-btn" onclick="openNoteDialog()">
          + Add Note
        </button>
        <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
      </div>
    </header>
    <section>
  <h2>Search Notes 🔎</h2>
  <input type="search" class="form-input" id="searchInput" placeholder="Search notes..." oninput="handleSearch()" />
</section>

    <main id="notesContainer" class="notes-grid"></main>
    <dialog id="noteDialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
          <button class="close-btn" onclick="closeNoteDialog()">X</button>
        </div>

        <form id="noteForm">
          <div class="form-group">
            <label for="noteTitle" class="form-label">Title</label>
            <input
              type="text"
              id="noteTitle"
              class="form-input"
              placeholder="Enter note title...."
              required
            />
          </div>

          <div class="form-group">
            <label for="noteContent" class="form-label">Content</label>
            <textarea
              id="noteContent"
              class="form-textarea"
              placeholder="Write your note here...."
              required
            ></textarea>
          </div>

          <div class="dialog-actions">
            <button
              type="button"
              class="cancel-btn"
              onclick="closeNoteDialog()"
            >
              Cancel
            </button>
            <button type="submit" class="save-btn">Save Note</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
